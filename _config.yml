# GitHub Pages (Jekyll) build settings for tools.oneyco.com.au.
#
# The paths below stay in the repository and its history, but GitHub Pages does
# not publish them (Tools V2.1 release hardening). The same paths are listed in
# .vercelignore for the Vercel deployment.
#
#   card/                    personal contact card
#   archive/                 obsolete page versions
#   docs/credit-framework/   internal planning documents
#   oney-security/index-*backup*.html   two unreferenced backups of the Security tool
#
# The remaining entries restore what a custom `exclude` replaces: the Jekyll
# defaults, and CNAME, which GitHub Pages keeps out of the published site.
exclude:
  - card/
  - archive/
  - docs/credit-framework/
  - oney-security/index-ui-backup-2026-02-25.html
  - oney-security/index-backup-before-gov-data.html
  - CNAME
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
