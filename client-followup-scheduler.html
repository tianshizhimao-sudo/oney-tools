<head>
<script>if(new URLSearchParams(location.search).has("embed"))document.documentElement.classList.add("embed-mode")</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Follow-up Scheduler — Oney & Co</title>
<style>/* embed-mode-css */
.embed-mode .header,.embed-mode header,.embed-mode .disclaimer-footer,.embed-mode [class*="disclaimer"],.embed-mode [class*="header-back"],.embed-mode nav.top-nav,.embed-mode .sidebar-toggle,.embed-mode .footer,.embed-mode .hero-section{display:none!important}.embed-mode body,.embed-mode .main,.embed-mode .container{padding-top:8px!important}

/* Embed mode */

.header{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--border)}
.logo svg{height:32px;width:auto}
.header h1{font-size:1.1rem;font-weight:600;color:var(--muted)}
.header-back{margin-left:auto;color:#2ECC85;text-decoration:none;font-size:.85rem;font-weight:500;white-space:nowrap}
.header-back:hover{text-decoration:underline}

*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#2ECC85;--green2:#1FAD73;--bg:#1A1A2E;--card:#252540;--border:#3D3D5C;--muted:#a3a3b8;--red:#e74c3c;--orange:#f39c12;--yellow:#f1c40f}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh;padding:20px}
.header{text-align:center;margin-bottom:30px}
.header h1{font-size:1.6rem;background:linear-gradient(135deg,var(--green),var(--green2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.header p{color:var(--muted);font-size:.85rem}
.logo{width:32px;height:32px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat .num{font-size:1.8rem;font-weight:700}
.stat .label{color:var(--muted);font-size:.75rem;margin-top:2px}
.stat.overdue .num{color:var(--red)}
.stat.today .num{color:var(--orange)}
.stat.upcoming .num{color:var(--yellow)}
.stat.done .num{color:var(--green)}
.controls{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.controls input,.controls select{background:var(--card);border:1px solid var(--border);color:#fff;padding:10px 14px;border-radius:8px;font-size:.85rem;outline:none}
.controls input:focus,.controls select:focus{border-color:var(--green)}
.controls input[type=text]{flex:1;min-width:200px}
.btn{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.secondary{background:var(--card);border:1px solid var(--border)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;transition:border-color .2s}
.item.overdue{border-left:4px solid var(--red)}
.item.today{border-left:4px solid var(--orange)}
.item.upcoming{border-left:4px solid var(--yellow)}
.item.completed{border-left:4px solid var(--green);opacity:.6}
.item-info{flex:1}
.item-name{font-weight:600;font-size:1rem;margin-bottom:2px}
.item-meta{color:var(--muted);font-size:.78rem;display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.item-meta span{display:flex;align-items:center;gap:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600}
.badge.overdue{background:rgba(231,76,60,.2);color:var(--red)}
.badge.today{background:rgba(243,156,18,.2);color:var(--orange)}
.badge.upcoming{background:rgba(241,196,15,.2);color:var(--yellow)}
.badge.completed{background:rgba(46,204,133,.2);color:var(--green)}
.item-actions{display:flex;gap:6px;flex-shrink:0}
.item-actions button{background:var(--border);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.item-actions button:hover{background:var(--green)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:90%;max-width:440px}
.modal h2{font-size:1.1rem;margin-bottom:16px;color:var(--green)}
.modal label{display:block;color:var(--muted);font-size:.78rem;margin-bottom:4px;margin-top:12px}
.modal input,.modal select,.modal textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:#fff;padding:10px;border-radius:8px;font-size:.85rem;outline:none}
.modal textarea{height:60px;resize:vertical}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--green)}
.modal-btns{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty span{font-size:2.5rem;display:block;margin-bottom:12px}
.header-back:hover{opacity:0.8}


    /* === 3-Theme Switcher === */
    .theme-switcher { display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:100px;padding:4px 6px;margin-left:8px; }
    .theme-dot { width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all 0.2s ease;position:relative; }
    .theme-dot:hover { transform:scale(1.15); }
    .theme-dot[data-theme="dark"] { background:#1A1A2E;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2); }
    .theme-dot[data-theme="purple"] { background:#9B59B6; }
    .theme-dot[data-theme="light"] { background:#F8F9FC;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.1); }
    .theme-dot.active { border-color:var(--accent, #2ECC85);transform:scale(1.15); }
    .theme-dot::after { content:attr(data-tooltip);position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-muted, #a3a3b8);background:var(--card, #252540);border:1px solid var(--border, #3D3D5C);padding:2px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.2s; }
    .theme-dot:hover::after { opacity:1; }
    html, html * { transition:background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }
    html.no-transition, html.no-transition * { transition:none !important; }
    .theme-float { position:fixed;top:12px;right:12px;z-index:9999; }
    /* Purple theme */
    html[data-theme="purple"] { --bg:#0D0D1A;--bg-secondary:#0A0A15;--card:#1A1228;--border:#3D2D5C;--accent:#9B59B6;--accent-light:#9B59B6;--accent-glow:rgba(155,89,182,0.1);--green:#9B59B6;--green-dark:#6B4C9A;--text:#ffffff;--text-muted:#b8a9c9;--accent-lighter:#C4A3F0;--green-gradient:linear-gradient(135deg,#9B59B6,#6B4C9A);--purple-gradient:linear-gradient(135deg,#9B59B6,#6B4C9A);--purple:#9B59B6;--purple-light:#B08AE0;--purple-glow:rgba(155,89,182,0.15);--primary:#9B59B6;--primary-light:#B08AE0;--primary-glow:rgba(155,89,182,0.15);--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#8b5cf6; }
    html[data-theme="purple"] nav, html[data-theme="purple"] .top-bar, html[data-theme="purple"] .header, html[data-theme="purple"] header { background:rgba(13,13,26,0.95)!important; }
    html[data-theme="purple"] .theme-switcher { background:rgba(155,89,182,0.08);border-color:rgba(155,89,182,0.15); }
    /* Light theme */
    html[data-theme="light"] { --bg:#F8F9FC;--bg-secondary:#EFF1F5;--card:#FFFFFF;--border:#E2E8F0;--accent:#1FAD73;--accent-light:#1FAD73;--accent-glow:rgba(31,173,115,0.1);--green:#1FAD73;--green-dark:#178A5C;--text:#1A1A2E;--text-muted:#6B7280;--accent-lighter:#4ADE94;--green-gradient:linear-gradient(135deg,#1FAD73,#178A5C);--purple-gradient:linear-gradient(135deg,#6B4C9A,#9B59B6);--purple:#6B4C9A;--purple-light:#9B59B6;--purple-glow:rgba(107,76,154,0.1);--primary:#1FAD73;--primary-light:#2ECC85;--primary-glow:rgba(31,173,115,0.1);--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6; }
    html[data-theme="light"] nav, html[data-theme="light"] .top-bar, html[data-theme="light"] .header, html[data-theme="light"] header { background:rgba(255,255,255,0.95)!important;box-shadow:0 1px 8px rgba(0,0,0,0.06); }
    html[data-theme="light"] .theme-switcher { background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.08); }
    html[data-theme="light"] .nav-logo text[fill="#ffffff"], html[data-theme="light"] .top-bar-logo text[fill="#ffffff"], html[data-theme="light"] .logo text[fill="#f0f0f5"], html[data-theme="light"] .logo text[fill="#ffffff"] { fill:#1A1A2E; }
  </style>
</head>
<body>
<div class="header">
  <div class="logo">
    <svg viewBox="0 0 120 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="14" stroke="#2ECC85" stroke-width="2.5" fill="none"/>
      <circle cx="16" cy="16" r="6" fill="#2ECC85"/>
      <text x="40" y="22" fill="#f0f0f5" font-family="Inter,sans-serif" font-weight="700" font-size="16">oney</text>
      <text x="82" y="22" fill="#a3a3b8" font-family="Inter,sans-serif" font-weight="400" font-size="11">&amp; co</text>
    </svg>
    <div class="theme-switcher" role="radiogroup" aria-label="Theme"><div class="theme-dot active" data-theme="dark" data-tooltip="Dark" role="radio" aria-checked="true" tabindex="0"></div><div class="theme-dot" data-theme="purple" data-tooltip="Purple" role="radio" aria-checked="false" tabindex="0"></div><div class="theme-dot" data-theme="light" data-tooltip="Light" role="radio" aria-checked="false" tabindex="0"></div></div>
</div>
  <h1>Client Followup Scheduler</h1>
  <a href="index.html" class="header-back">← Back to Tools</a>
</div>

<div class="stats">
<div class="stat overdue"><div class="num" id="sOverdue">0</div><div class="label">Overdue</div></div>
<div class="stat today"><div class="num" id="sToday">0</div><div class="label">Due Today</div></div>
<div class="stat upcoming"><div class="num" id="sUpcoming">0</div><div class="label">Next 7 Days</div></div>
<div class="stat done"><div class="num" id="sDone">0</div><div class="label">Completed</div></div>
</div>

<div class="controls">
<input type="text" id="search" placeholder="🔍 Search clients...">
<select id="filterStatus"><option value="all">All Status</option><option value="overdue">Overdue</option><option value="today">Due Today</option><option value="upcoming">Next 7 Days</option><option value="completed">Completed</option></select>
<select id="filterType"><option value="all">All Types</option><option value="Initial Call">Initial Call</option><option value="Application Update">Application Update</option><option value="Settlement Check">Settlement Check</option><option value="Post-Settlement">Post-Settlement</option><option value="Annual Review">Annual Review</option><option value="Rate Review">Rate Review</option><option value="General">General</option></select>
<button class="btn" onclick="openModal()">+ New Follow-up</button>
</div>

<div class="list" id="list"></div>

<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h2 id="modalTitle">New Follow-up</h2>
<label>Client Name *</label>
<input type="text" id="fName" placeholder="e.g. John Smith">
<label>Follow-up Type</label>
<select id="fType"><option>Initial Call</option><option>Application Update</option><option>Settlement Check</option><option>Post-Settlement</option><option>Annual Review</option><option>Rate Review</option><option>General</option></select>
<label>Due Date *</label>
<input type="date" id="fDate">
<label>Repeat Interval</label>
<select id="fRepeat"><option value="none">No Repeat</option><option value="7">Every Week</option><option value="14">Every 2 Weeks</option><option value="30">Every Month</option><option value="90">Every Quarter</option><option value="180">Every 6 Months</option><option value="365">Every Year</option></select>
<label>Notes</label>
<textarea id="fNotes" placeholder="Optional notes..."></textarea>
<input type="hidden" id="fId">
<div class="modal-btns">
<button class="btn secondary" onclick="closeModal()">Cancel</button>
<button class="btn" onclick="saveItem()">Save</button>
</div>
</div>
</div>

<script>
const LS_KEY='oney_followups';
let items=JSON.parse(localStorage.getItem(LS_KEY)||'[]');

function save(){localStorage.setItem(LS_KEY,JSON.stringify(items))}
function today(){return new Date().toISOString().split('T')[0]}
function diffDays(d){return Math.ceil((new Date(d)-new Date(today()))/(864e5))}

function status(item){
  if(item.completed)return'completed';
  const d=diffDays(item.date);
  if(d<0)return'overdue';
  if(d===0)return'today';
  if(d<=7)return'upcoming';
  return'future';
}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const fs=document.getElementById('filterStatus').value;
  const ft=document.getElementById('filterType').value;
  let filtered=items.filter(i=>{
    if(q&&!i.name.toLowerCase().includes(q)&&!(i.notes||'').toLowerCase().includes(q))return false;
    if(ft!=='all'&&i.type!==ft)return false;
    const s=status(i);
    if(fs!=='all'&&fs!==s)return false;
    return true;
  });
  filtered.sort((a,b)=>{
    if(a.completed!==b.completed)return a.completed?1:-1;
    return new Date(a.date)-new Date(b.date);
  });

  let counts={overdue:0,today:0,upcoming:0,completed:0};
  items.forEach(i=>{const s=status(i);if(counts[s]!==undefined)counts[s]++});
  document.getElementById('sOverdue').textContent=counts.overdue;
  document.getElementById('sToday').textContent=counts.today;
  document.getElementById('sUpcoming').textContent=counts.upcoming;
  document.getElementById('sDone').textContent=counts.completed;

  const list=document.getElementById('list');
  if(!filtered.length){list.innerHTML='<div class="empty"><span>📋</span>No follow-ups found.<br>Click "+ New Follow-up" to get started!</div>';return}

  list.innerHTML=filtered.map(i=>{
    const s=status(i);
    const d=diffDays(i.date);
    let timeText='';
    if(s==='completed')timeText='✅ Done';
    else if(d<0)timeText=`${Math.abs(d)} day${Math.abs(d)>1?'s':''} overdue`;
    else if(d===0)timeText='Due today';
    else timeText=`In ${d} day${d>1?'s':''}`;
    const repeat=i.repeat!=='none'?`🔁 ${({7:'Weekly',14:'Bi-weekly',30:'Monthly',90:'Quarterly',180:'6-Monthly',365:'Yearly'})[i.repeat]}`:'';
    return`<div class="item ${s}">
      <div class="item-info">
        <div class="item-name">${i.name} <span class="badge ${s}">${timeText}</span></div>
        <div class="item-meta">
          <span>📌 ${i.type}</span>
          <span>📅 ${i.date}</span>
          ${repeat?`<span>${repeat}</span>`:''}
          ${i.notes?`<span>💬 ${i.notes.substring(0,40)}${i.notes.length>40?'...':''}</span>`:''}
        </div>
      </div>
      <div class="item-actions">
        ${!i.completed?`<button title="Complete" onclick="complete('${i.id}')">✅</button>`:`<button title="Reopen" onclick="reopen('${i.id}')">↩️</button>`}
        <button title="Snooze +3 days" onclick="snooze('${i.id}')">⏰</button>
        <button title="Edit" onclick="edit('${i.id}')">✏️</button>
        <button title="Delete" onclick="del('${i.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function openModal(id){
  document.getElementById('modalTitle').textContent=id?'Edit Follow-up':'New Follow-up';
  if(id){
    const i=items.find(x=>x.id===id);
    document.getElementById('fName').value=i.name;
    document.getElementById('fType').value=i.type;
    document.getElementById('fDate').value=i.date;
    document.getElementById('fRepeat').value=i.repeat;
    document.getElementById('fNotes').value=i.notes||'';
    document.getElementById('fId').value=id;
  }else{
    document.getElementById('fName').value='';
    document.getElementById('fDate').value=today();
    document.getElementById('fRepeat').value='none';
    document.getElementById('fNotes').value='';
    document.getElementById('fId').value='';
  }
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('active')}

function saveItem(){
  const name=document.getElementById('fName').value.trim();
  const date=document.getElementById('fDate').value;
  if(!name||!date){alert('Name and date required');return}
  const id=document.getElementById('fId').value;
  const obj={
    id:id||Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name,
    type:document.getElementById('fType').value,
    date,
    repeat:document.getElementById('fRepeat').value,
    notes:document.getElementById('fNotes').value.trim(),
    completed:false
  };
  if(id){const idx=items.findIndex(x=>x.id===id);if(idx>=0)items[idx]={...items[idx],...obj}}
  else items.push(obj);
  save();closeModal();render();
}

function complete(id){
  const i=items.find(x=>x.id===id);if(!i)return;
  i.completed=true;i.completedDate=today();
  if(i.repeat!=='none'){
    const next=new Date(i.date);next.setDate(next.getDate()+parseInt(i.repeat));
    items.push({...i,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:next.toISOString().split('T')[0],completed:false,completedDate:null});
  }
  save();render();
}

function reopen(id){const i=items.find(x=>x.id===id);if(i){i.completed=false;i.completedDate=null;save();render()}}
function snooze(id){const i=items.find(x=>x.id===id);if(i){const d=new Date(i.date);d.setDate(d.getDate()+3);i.date=d.toISOString().split('T')[0];save();render()}}
function edit(id){openModal(id)}
function del(id){if(confirm('Delete this follow-up?')){items=items.filter(x=>x.id!==id);save();render()}}

document.getElementById('search').addEventListener('input',render);
document.getElementById('filterStatus').addEventListener('change',render);
document.getElementById('filterType').addEventListener('change',render);
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
render();
</script>

<script>
(function(){var s=localStorage.getItem('oney-theme')||'dark';document.documentElement.classList.add('no-transition');document.documentElement.setAttribute('data-theme',s);requestAnimationFrame(function(){requestAnimationFrame(function(){document.documentElement.classList.remove('no-transition')})});document.querySelectorAll('.theme-dot').forEach(function(d){d.classList.toggle('active',d.dataset.theme===s);d.setAttribute('aria-checked',String(d.dataset.theme===s))});var sw=document.querySelector('.theme-switcher');if(sw){sw.addEventListener('click',function(e){var dot=e.target.closest('.theme-dot');if(!dot)return;var t=dot.dataset.theme;document.documentElement.setAttribute('data-theme',t);localStorage.setItem('oney-theme',t);document.querySelectorAll('.theme-dot').forEach(function(d){d.classList.toggle('active',d.dataset.theme===t);d.setAttribute('aria-checked',String(d.dataset.theme===t))})});sw.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}})}})();
</script>
