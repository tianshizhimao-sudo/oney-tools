<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Scenario Comparator — Oney & Co</title>
<style>
.header{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--border)}
.logo svg{height:32px;width:auto}
.header h1{font-size:1.1rem;font-weight:600;color:var(--muted)}
.header-back{margin-left:auto;color:#2ECC85;text-decoration:none;font-size:.85rem;font-weight:500;white-space:nowrap}
.header-back:hover{text-decoration:underline}

*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#2ECC85;--green2:#1FAD73;--purple:#6B4C9A;--bg:#1A1A2E;--card:#252540;--border:#3D3D5C;--muted:#a3a3b8;--text:#f0f0f0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.header{text-align:center;margin-bottom:30px}
.header h1{font-size:1.6rem;background:linear-gradient(135deg,var(--green),var(--green2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.header p{color:var(--muted);font-size:.85rem}
.logo{font-size:.75rem;color:var(--muted);margin-top:2px}
.scenarios{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:30px}
.scenario{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;transition:border-color .2s}
.scenario:hover{border-color:var(--green)}
.scenario.best{border-color:var(--green);box-shadow:0 0 20px rgba(46,204,133,.15)}
.best-badge{position:absolute;top:-10px;right:16px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:10px;text-transform:uppercase}
.sc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sc-title{font-size:1.1rem;font-weight:600}
.sc-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.2rem}
.sc-remove:hover{color:#e74c3c}
.field{margin-bottom:12px}
.field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem}
.field input:focus,.field select:focus{outline:none;border-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.results-box{margin-top:16px;padding:14px;background:var(--bg);border-radius:10px;border:1px solid var(--border)}
.result-row{display:flex;justify-content:space-between;padding:6px 0;font-size:.85rem}
.result-row:not(:last-child){border-bottom:1px solid var(--border)}
.result-label{color:var(--muted)}
.result-value{font-weight:600}
.result-value.highlight{color:var(--green)}
.bar-container{margin-top:12px}
.bar-label{font-size:.7rem;color:var(--muted);margin-bottom:4px}
.bar-bg{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.bar-principal{background:var(--green)}
.bar-interest{background:var(--purple)}
.bar-legend{display:flex;gap:14px;margin-top:6px;font-size:.7rem;color:var(--muted)}
.bar-legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.bar-legend .leg-p::before{background:var(--green)}
.bar-legend .leg-i::before{background:var(--purple)}
.actions{text-align:center;margin-bottom:30px}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;margin-right:10px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--green);color:var(--green)}
.summary{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.summary h2{font-size:1.1rem;margin-bottom:16px;color:var(--green)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.sum-card{background:var(--bg);padding:14px;border-radius:8px;text-align:center}
.sum-card .label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.sum-card .value{font-size:1.4rem;font-weight:700;color:var(--green)}
.sum-card .sub{font-size:.75rem;color:var(--muted);margin-top:2px}
.print-section{display:none}
@media print{
body{background:#fff;color:#000;padding:10px}
.scenario{border-color:#ccc;break-inside:avoid}
.field input,.field select{border-color:#ccc;background:#f9f9f9;color:#000}
.results-box{background:#f9f9f9;border-color:#ccc}
.result-label{color:#666}
.btn,.sc-remove{display:none}
.print-section{display:block;text-align:center;margin-bottom:10px;font-size:.75rem;color:#999}
.header h1{-webkit-text-fill-color:#1FAD73}
}
.header-back:hover{opacity:0.8}

</style>
</head>
<body>
<div class="print-section">Oney & Co — Loan Scenario Comparison — Generated <span id="printDate"></span></div>
<div class="header">
  <div class="logo">
    <svg viewBox="0 0 120 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="14" stroke="#2ECC85" stroke-width="2.5" fill="none"/>
      <circle cx="16" cy="16" r="6" fill="#2ECC85"/>
      <text x="40" y="22" fill="#f0f0f5" font-family="Inter,sans-serif" font-weight="700" font-size="16">oney</text>
      <text x="82" y="22" fill="#a3a3b8" font-family="Inter,sans-serif" font-weight="400" font-size="11">&amp; co</text>
    </svg>
  </div>
  <h1>Loan Scenario Comparator</h1>
  <a href="index.html" class="header-back">← Back to Tools</a>
</div>
</div>

<div class="actions">
<button class="btn btn-green" onclick="addScenario()">+ Add Scenario</button>
<button class="btn btn-outline" onclick="window.print()">🖨️ Print</button>
<button class="btn btn-outline" onclick="clearAll()">🗑️ Clear All</button>
</div>

<div class="summary" id="summaryBox" style="display:none">
<h2>💡 Quick Summary</h2>
<div class="summary-grid" id="summaryGrid"></div>
</div>

<div class="scenarios" id="scenarioContainer"></div>

<script>
let scenarios = [];
let nextId = 1;

function addScenario(data) {
  if (scenarios.length >= 4) return;
  const id = nextId++;
  const s = data || { name: `Option ${id}`, amount: 500000, rate: 6.0, years: 30, type: 'pi', lender: '' };
  s.id = id;
  scenarios.push(s);
  render();
}

function removeScenario(id) {
  scenarios = scenarios.filter(s => s.id !== id);
  render();
}

function clearAll() {
  scenarios = [];
  nextId = 1;
  render();
}

function calc(amount, rate, years, type) {
  const r = rate / 100 / 12;
  const n = years * 12;
  let monthly, totalInterest;
  if (type === 'io') {
    monthly = amount * r;
    totalInterest = monthly * n;
  } else {
    if (r === 0) { monthly = amount / n; totalInterest = 0; }
    else { monthly = amount * r * Math.pow(1+r,n) / (Math.pow(1+r,n)-1); totalInterest = monthly * n - amount; }
  }
  return { monthly, totalInterest, totalCost: amount + totalInterest };
}

function fmt(n) { return '$' + Math.round(n).toLocaleString('en-AU'); }

function render() {
  const container = document.getElementById('scenarioContainer');
  const results = scenarios.map(s => ({ ...s, ...calc(s.amount, s.rate, s.years, s.type) }));
  const cheapest = results.length > 1 ? results.reduce((a,b) => a.totalCost < b.totalCost ? a : b) : null;
  const maxCost = Math.max(...results.map(r => r.totalCost), 1);

  container.innerHTML = results.map(r => {
    const isBest = cheapest && r.id === cheapest.id;
    const pPct = (r.amount / r.totalCost * 100).toFixed(1);
    const iPct = (r.totalInterest / r.totalCost * 100).toFixed(1);
    return `
    <div class="scenario ${isBest ? 'best' : ''}">
      ${isBest ? '<div class="best-badge">💰 Cheapest</div>' : ''}
      <div class="sc-header">
        <input class="sc-title" style="background:none;border:none;color:var(--text);font-size:1.1rem;font-weight:600;padding:0;width:70%" value="${r.name}" onchange="updateField(${r.id},'name',this.value)">
        <button class="sc-remove" onclick="removeScenario(${r.id})">×</button>
      </div>
      <div class="field"><label>Lender</label><input placeholder="e.g. CBA, NAB..." value="${r.lender||''}" onchange="updateField(${r.id},'lender',this.value)"></div>
      <div class="row2">
        <div class="field"><label>Loan Amount</label><input type="number" value="${r.amount}" onchange="updateField(${r.id},'amount',+this.value)"></div>
        <div class="field"><label>Rate %</label><input type="number" step="0.01" value="${r.rate}" onchange="updateField(${r.id},'rate',+this.value)"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Term (Years)</label><input type="number" value="${r.years}" onchange="updateField(${r.id},'years',+this.value)"></div>
        <div class="field"><label>Repayment</label><select onchange="updateField(${r.id},'type',this.value)">
          <option value="pi" ${r.type==='pi'?'selected':''}>Principal & Interest</option>
          <option value="io" ${r.type==='io'?'selected':''}>Interest Only</option>
        </select></div>
      </div>
      <div class="results-box">
        <div class="result-row"><span class="result-label">Monthly Repayment</span><span class="result-value highlight">${fmt(r.monthly)}</span></div>
        <div class="result-row"><span class="result-label">Total Interest</span><span class="result-value">${fmt(r.totalInterest)}</span></div>
        <div class="result-row"><span class="result-label">Total Cost</span><span class="result-value">${fmt(r.totalCost)}</span></div>
        ${cheapest && !isBest ? `<div class="result-row"><span class="result-label">vs Cheapest</span><span class="result-value" style="color:#e74c3c">+${fmt(r.totalCost - cheapest.totalCost)}</span></div>` : ''}
        <div class="bar-container">
          <div class="bar-label">Principal vs Interest breakdown</div>
          <div style="display:flex;gap:2px">
            <div class="bar-bg" style="flex:${pPct}"><div class="bar-fill bar-principal" style="width:100%"></div></div>
            <div class="bar-bg" style="flex:${iPct}"><div class="bar-fill bar-interest" style="width:100%"></div></div>
          </div>
          <div class="bar-legend"><span class="leg-p">Principal ${pPct}%</span><span class="leg-i">Interest ${iPct}%</span></div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Summary
  const box = document.getElementById('summaryBox');
  const grid = document.getElementById('summaryGrid');
  if (results.length >= 2) {
    box.style.display = 'block';
    const savings = Math.max(...results.map(r=>r.totalCost)) - Math.min(...results.map(r=>r.totalCost));
    const monthlySavings = Math.max(...results.map(r=>r.monthly)) - Math.min(...results.map(r=>r.monthly));
    grid.innerHTML = `
      <div class="sum-card"><div class="label">Max Potential Savings</div><div class="value">${fmt(savings)}</div><div class="sub">over loan life</div></div>
      <div class="sum-card"><div class="label">Monthly Difference</div><div class="value">${fmt(monthlySavings)}</div><div class="sub">per month</div></div>
      <div class="sum-card"><div class="label">Best Option</div><div class="value" style="font-size:1rem">${cheapest?.name||'-'}</div><div class="sub">${cheapest?.lender||'—'} @ ${cheapest?.rate}%</div></div>
    `;
  } else { box.style.display = 'none'; }

  save();
}

function updateField(id, field, value) {
  const s = scenarios.find(x => x.id === id);
  if (s) { s[field] = value; render(); }
}

function save() {
  localStorage.setItem('oney-loan-comparator', JSON.stringify({ scenarios, nextId }));
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem('oney-loan-comparator'));
    if (d?.scenarios?.length) { scenarios = d.scenarios; nextId = d.nextId || scenarios.length + 1; render(); return; }
  } catch(e) {}
  addScenario({ name: 'Option A', amount: 500000, rate: 6.09, years: 30, type: 'pi', lender: 'CBA' });
  addScenario({ name: 'Option B', amount: 500000, rate: 5.89, years: 30, type: 'pi', lender: 'NAB' });
}

document.getElementById('printDate').textContent = new Date().toLocaleDateString('en-AU');
load();
</script>

<div style="text-align:center;padding:16px 24px;font-size:11px;color:#666;border-top:1px solid var(--border,#3D3D5C);margin-top:auto">
  ⚠️ This tool is for informational purposes only and does not constitute financial advice. Please consult a licensed professional before making financial decisions.
</div>
</body>
</html>
