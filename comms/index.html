<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content & Comms — Oney & Co</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{--bg:#1A1A2E;--card:#252540;--border:#3D3D5C;--muted:#a3a3b8;--text:#f0f0f5;--green:#2ECC85;--green2:#1FAD73;--purple:#6B4C9A;--sidebar-w:240px;--sidebar-bg:#16162a;--topbar-bg:rgba(22,22,42,0.95)}
[data-theme="light"]{--bg:#f5f5f5;--card:#ffffff;--border:#e0e0e0;--muted:#666;--text:#1a1a1a;--green:#1FAD73;--green2:#2ECC85;--purple:#6B4C9A;--sidebar-bg:#16162a;--topbar-bg:rgba(255,255,255,0.95)}
[data-theme="light"] .sidebar{color:#f0f0f5;border-right-color:#3D3D5C}[data-theme="light"] .sidebar .sidebar-logo h1{color:#f0f0f5}[data-theme="light"] .sidebar .sidebar-subtitle{color:#a3a3b8}[data-theme="light"] .sidebar-nav a{color:#a3a3b8}[data-theme="light"] .sidebar-nav a:hover,[data-theme="light"] .sidebar-nav a.active{color:#f0f0f5}[data-theme="light"] .sidebar-footer{border-top-color:#3D3D5C}[data-theme="light"] .sidebar-footer a{color:#2ECC85}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border)}
.sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sidebar-logo svg{height:28px;width:auto;flex-shrink:0}
.sidebar-logo h1{font-size:15px;font-weight:700;color:var(--text)}
.sidebar-subtitle{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.sidebar-nav{flex:1;padding:12px 0}
.nav-section-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:16px 20px 8px;opacity:0.7}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-left:3px solid transparent;transition:all 0.2s}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav-item.active{color:var(--green);border-left-color:var(--green);background:rgba(46,204,133,0.08)}
.nav-icon{font-size:14px;width:20px;text-align:center}
.sidebar-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sidebar-footer a{color:var(--green);text-decoration:none;font-size:12px;font-weight:500}
.theme-toggle{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;color:var(--muted);transition:all .2s}
.theme-toggle:hover{border-color:var(--green);color:var(--green)}
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top-bar{display:flex;align-items:center;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--topbar-bg);flex-shrink:0}
.breadcrumb{font-size:13px;color:var(--muted)}.breadcrumb .current{color:var(--text);font-weight:600}
.content{flex:1;overflow:hidden}.content iframe{width:100%;height:100%;border:none}
.sidebar-toggle{display:none;position:fixed;top:12px;left:12px;z-index:200;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:20px;align-items:center;justify-content:center}
.sidebar-overlay{display:none;position:fixed;inset:0;z-index:140;background:rgba(0,0,0,0.5)}
@media(max-width:767px){.sidebar{position:fixed;top:0;left:0;bottom:0;z-index:150;transform:translateX(-100%);transition:transform .3s}.sidebar.open{transform:translateX(0)}.sidebar-toggle{display:flex}.sidebar-overlay.open{display:block}}
</style>
</head>
<body>
<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('open')">☰</button>
<div class="sidebar-overlay" onclick="document.querySelector('.sidebar').classList.remove('open');this.classList.remove('open')"></div>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="fg" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#1FAD73"/><stop offset="60%" stop-color="#2ECC85"/><stop offset="60%" stop-color="transparent"/><stop offset="100%" stop-color="transparent"/></linearGradient><linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2ECC85"/><stop offset="100%" stop-color="#1FAD73"/></linearGradient></defs><circle cx="16" cy="20" r="14" fill="none" stroke="url(#sg)" stroke-width="3"/><circle cx="16" cy="20" r="10" fill="url(#fg)"/><text x="38" y="25" fill="#f0f0f5" font-family="Inter,sans-serif" font-weight="700" font-size="15">oney</text><text x="80" y="25" fill="#a3a3b8" font-family="Inter,sans-serif" font-weight="400" font-size="11">\&amp; co</text></svg>
      <h1>Comms</h1>
    </div>
    <div class="sidebar-subtitle">Content & Communications</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-title">Templates</div>
    <div class="nav-item" data-src="../email-template-generator.html?embed" data-label="Email Templates"><span class="nav-icon">📧</span>Email Templates</div>
    <div class="nav-item" data-src="../social-post-generator.html?embed" data-label="Social Posts"><span class="nav-icon">📱</span>Social Posts</div>
    <div class="nav-item" data-src="../client-newsletter.html?embed" data-label="Newsletter"><span class="nav-icon">📰</span>Newsletter</div>
    <div class="nav-item" data-src="../market-update.html?embed" data-label="Market Update"><span class="nav-icon">📊</span>Market Update</div>
    <div class="nav-section-title">Productivity</div>
    <div class="nav-item" data-src="../meeting-notes.html?embed" data-label="Meeting Notes"><span class="nav-icon">📝</span>Meeting Notes</div>
    <div class="nav-item" data-src="../daily-task-prioritizer.html?embed" data-label="Task Prioritizer"><span class="nav-icon">✅</span>Task Prioritizer</div>
    <div class="nav-section-title">Compliance</div>
    <div class="nav-item" data-src="../compliance-checklist.html?embed" data-label="Compliance Checklist"><span class="nav-icon">🔒</span>Compliance</div>
  </nav>
  <div class="sidebar-footer"><a href="../tools.html">← Back to Tools</a><button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button></div>
</aside>

<main class="main">
  <div class="top-bar"><div class="breadcrumb">Content & Comms › <span class="current" id="current-page">Loading...</span></div></div>
  <div class="content"><iframe id="tool-frame" src="" title="Tool"></iframe></div>
</main>

<script>
const navItems=document.querySelectorAll('.nav-item'),frame=document.getElementById('tool-frame'),cp=document.getElementById('current-page');
function nav(el){navItems.forEach(n=>n.classList.remove('active'));el.classList.add('active');frame.src=el.dataset.src;cp.textContent=el.dataset.label;document.querySelector('.sidebar')?.classList.remove('open');document.querySelector('.sidebar-overlay')?.classList.remove('open')}
navItems.forEach(i=>i.addEventListener('click',()=>nav(i)));
nav(document.querySelector('.nav-item'));

function toggleTheme(){
  const html=document.documentElement;
  const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
  html.setAttribute('data-theme',next);
  document.getElementById('tool-frame')?.contentWindow?.postMessage({type:'THEME_CHANGE',theme:next},'*');
  localStorage.setItem('oney-theme',next);
  document.querySelector('.theme-toggle').textContent=next==='dark'?'🌙':'☀️';
}
(function(){const t=localStorage.getItem('oney-theme');if(t){document.documentElement.setAttribute('data-theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'🌙':'☀️';}})();
frame.addEventListener('load',()=>{const t=document.documentElement.getAttribute('data-theme');frame.contentWindow?.postMessage({type:'THEME_CHANGE',theme:t},'*');});
</script>
</body>
</html>
