<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Oney Pro Workspace — Unified case workspace</title>
  <meta name="description" content="One workspace, one shared dataset, one credit summary. Built on the same finance engine as every free Oney tool.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='fg' x1='0%25' y1='100%25' x2='0%25' y2='0%25'><stop offset='0%25' stop-color='%231FAD73'/><stop offset='60%25' stop-color='%232ECC85'/><stop offset='60%25' stop-color='transparent'/><stop offset='100%25' stop-color='transparent'/></linearGradient><linearGradient id='sg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%232ECC85'/><stop offset='100%25' stop-color='%231FAD73'/></linearGradient></defs><g transform='translate(50,50)'><circle r='38' fill='none' stroke='url(%23sg)' stroke-width='10' stroke-linecap='round'/><circle r='28' fill='url(%23fg)'/></g></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/brand.css">
  <link rel="stylesheet" href="/assets/css/tool-shell.css">
  <link rel="canonical" href="https://tools.oneyco.com.au/pro/">
  <style id="pro-gate-style">
    #pro-password-gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#1A1A2E;font-family:Inter,system-ui,sans-serif}
    #pro-password-gate .box{text-align:center;padding:40px;border-radius:12px;background:#252540;border:1px solid #3D3D5C;max-width:340px;width:90%}
    #pro-password-gate h2{color:#2ECC85;margin:0 0 8px;font-size:20px}
    #pro-password-gate p{color:#a3a3b8;font-size:13px;margin:0 0 20px}
    #pro-password-gate input{width:100%;padding:10px 14px;border-radius:6px;border:1px solid #3D3D5C;background:#1A1A2E;color:#e0e0e0;font-size:14px;outline:none;box-sizing:border-box}
    #pro-password-gate input:focus{border-color:#2ECC85}
    #pro-password-gate button{margin-top:12px;width:100%;padding:10px;border:none;border-radius:6px;background:linear-gradient(135deg,#2ECC85,#1FAD73);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
    #pro-password-gate .err{color:#e74c3c;font-size:12px;margin-top:8px;display:none}
    body > *:not(#pro-password-gate){visibility:hidden}
  </style>
</head>
<body class="tool-page">
  <div id="pro-password-gate">
    <div class="box">
      <h2>🔒 Oney Pro Workspace</h2>
      <p>Testing access only</p>
      <input type="password" id="pro-gate-pw" placeholder="Enter password" autofocus />
      <button type="button" id="pro-gate-enter">Enter</button>
      <div class="err" id="pro-gate-err">Incorrect password</div>
    </div>
  </div>
  <script>
    (function(){
      function sha256(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''))}
      var HASH='593d6f478211fa2ca31f3c8cef009f7f2342db24d1bf3ba1c1bd27c8edb9fedb';
      function unlock(){
        var g=document.getElementById('pro-password-gate');
        var s=document.getElementById('pro-gate-style');
        if(g)g.remove();
        if(s)s.remove();
      }
      function checkPw(){
        var v=document.getElementById('pro-gate-pw').value;
        sha256(v).then(function(h){
          if(h===HASH){sessionStorage.setItem('ps-auth','1');unlock()}
          else{document.getElementById('pro-gate-err').style.display='block'}
        });
      }
      document.getElementById('pro-gate-enter').addEventListener('click',checkPw);
      document.getElementById('pro-gate-pw').addEventListener('keydown',function(e){if(e.key==='Enter')checkPw()});
      if(sessionStorage.getItem('ps-auth')==='1')unlock();
    })();
  </script>
  <div class="ambient-bg"></div>

  <nav class="brand-nav">
    <div class="brand-nav-inner">
      <a href="https://oneyco.com.au" class="brand-logo">
        <div class="brand-logo-mark"><span></span></div>
        <span class="brand-logo-text">Oney <span class="amp">&amp;</span> Co</span>
      </a>
      <button class="brand-nav-hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="brand-nav-links">
        <a href="/" class="brand-nav-link">Home</a>
        <a href="/assess/" class="brand-nav-link">Assess</a>
        <a href="/calculate/" class="brand-nav-link">Calculate</a>
        <a href="/analyse/" class="brand-nav-link">Analyse</a>
        <a href="/pro/" class="brand-nav-link active">Pro</a>
      </div>
    </div>
  </nav>

  <div id="pro-import-banner" class="container" style="padding-top:16px;position:relative;z-index:1"></div>

  <main></main>

  <div class="container" style="padding-bottom:40px;position:relative;z-index:1;">
    <div id="pro-actions" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:-16px;"></div>
  </div>

  <footer class="brand-footer">
    <p>Oney &amp; Co — Clarity in every deal</p>
    <p><a href="https://oneyco.com.au">oneyco.com.au</a></p>
  </footer>

  <script type="module">
    import { mountToolPage } from '/assets/js/ui/shell.js';
    import { initAll } from '/assets/js/ui/motion.js';
    import { proWorkspaceConfig } from '/assets/js/tools/pro-workspace.config.js';
    import { isPro, setPro } from '/assets/js/app/gating.js';
    import { storage, SCOPES } from '/assets/js/app/storage.js';
    import { consumePendingImports, getProFlow } from '/assets/js/app/pro-bridge.js';

    /* ---------- Import banner ---------- */
    const SOURCE_LABEL = {
      servicing: 'Commercial Servicing',
      'security-assessment': 'Security Assessment',
      'investment-yield': 'Investment Yield',
      'commercial-investment': 'Commercial Investment',
      'flow-visualiser': 'Flow Visualiser',
    };
    function renderImportBanner() {
      const params = new URLSearchParams(window.location.search);
      const from = params.get('from');
      const pending = consumePendingImports();
      if (!from && !pending.length) return;
      const sources = new Set(pending.map((p) => p.sourceToolId));
      if (from) sources.add(from);
      const labels = [...sources].map((s) => SOURCE_LABEL[s] || s).join(', ');
      const banner = document.getElementById('pro-import-banner');
      banner.innerHTML = `
        <div style="border:1px solid rgba(46,204,133,0.30);
                    background:linear-gradient(90deg,rgba(46,204,133,0.10),rgba(107,76,154,0.06));
                    border-radius:14px;padding:14px 18px;display:flex;
                    align-items:center;gap:12px;flex-wrap:wrap;font-size:14px">
          <strong style="color:#9be7c1">Imported</strong>
          <span style="color:var(--text-soft)">Case context loaded from <strong>${labels}</strong>.</span>
          <span style="flex:1"></span>
          <button type="button" id="banner-dismiss" style="background:transparent;border:0;
                  color:var(--text-muted);cursor:pointer;font-size:18px;line-height:1">×</button>
        </div>`;
      document.getElementById('banner-dismiss').addEventListener('click', () => banner.innerHTML = '');
    }
    renderImportBanner();

    mountToolPage({
      config: proWorkspaceConfig,
      assistCards: [
        {
          title: 'One dataset, every tool',
          bodyHtml: '<p>Servicing, security, DTI and credit summary all read the same inputs. Change a value here and the downstream calcs update.</p>',
        },
        {
          title: 'Pro gating',
          bodyHtml: `<p style="margin-bottom:10px">Pro view reveals lender matrix detail inside /tools/ pages.</p>
            <button type="button" id="pro-toggle" class="btn btn-secondary" style="width:100%">Checking…</button>`,
        },
      ],
    });

    // Pro-specific action bar: export / reset
    const { exportProJSON, exportProPDF } = await import('/assets/js/tools/pro-export.js');
    const actions = document.getElementById('pro-actions');
    actions.innerHTML = `
      <button type="button" class="btn btn-pro" id="pro-export-pdf">Export PDF</button>
      <button type="button" class="btn btn-secondary" id="pro-export-json">Export JSON</button>
      <button type="button" class="btn btn-ghost" id="pro-reset">Reset workspace</button>
    `;
    document.getElementById('pro-export-json').addEventListener('click', exportProJSON);
    document.getElementById('pro-export-pdf').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const original = btn.textContent;
      btn.textContent = 'Generating…'; btn.disabled = true;
      try { await exportProPDF(); }
      catch (err) { alert('PDF export failed: ' + (err && err.message ? err.message : err)); }
      finally { btn.textContent = original; btn.disabled = false; }
    });
    document.getElementById('pro-reset').addEventListener('click', () => {
      if (!confirm('Clear all workspace inputs?')) return;
      storage.remove(SCOPES.PRO, proWorkspaceConfig.id);
      window.location.reload();
    });

    // Pro-mode toggle (controls gated result blocks on /tools/ pages)
    const toggle = document.getElementById('pro-toggle');
    function syncToggle() {
      const pro = isPro();
      toggle.textContent = pro ? 'Pro mode: ON — click to turn off' : 'Pro mode: OFF — click to enable';
    }
    syncToggle();
    toggle.addEventListener('click', () => {
      setPro(!isPro());
      syncToggle();
    });

    initAll();
  </script>
</body>
</html>
