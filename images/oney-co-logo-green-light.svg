<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 80">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC85"/>
      <stop offset="100%" style="stop-color:#1FAD73"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6B4C9A"/>
      <stop offset="100%" style="stop-color:#9B59B6"/>
    </linearGradient>
  </defs>
  
  <!-- O icon -->
  <g transform="translate(35, 40)">
    <path d="M 0 -30 A 30 30 0 1 0 0 -29.99" 
          fill="none" 
          stroke="url(#greenGrad)" 
          stroke-width="8"
          stroke-linecap="round"
          stroke-dasharray="180 10"/>
    <path d="M0 -36 L0 -46" stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- ney&co -->
  <text x="42" y="44" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-weight="600" fill="#1a1a1a" letter-spacing="-1.5">ney<tspan fill="url(#greenGrad)" font-size="32" font-weight="500">&amp;</tspan>co</text>
  
  <!-- 紫色点 右移 (cx: 170→176) -->
  <circle cx="176" cy="40" r="3" fill="url(#purpleAccent)"/>
</svg>
