<!DOCTYPE html>
<html lang="en">
<head>
<script>if(new URLSearchParams(location.search).has("embed"))document.documentElement.classList.add("embed-mode")</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Onboarding Checklist — Oney & Co</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* embed-mode-css */
.embed-mode .header,.embed-mode header,.embed-mode .disclaimer-footer,.embed-mode [class*="disclaimer"],.embed-mode [class*="header-back"],.embed-mode nav.top-nav,.embed-mode .sidebar-toggle,.embed-mode .footer,.embed-mode .hero-section{display:none!important}.embed-mode body,.embed-mode .main,.embed-mode .container{padding-top:8px!important}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="dark"]{--bg:#1A1A2E;--card:#252540;--border:#3D3D5C;--muted:#a3a3b8;--green:#2ECC85;--green2:#1FAD73;--purple:#6B4C9A;--purple2:#9B59B6;--text:#f0f0f5;--white:#fff}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--green)}
.header{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--border)}
.logo svg{height:32px;width:auto}
.header h1{font-size:1.1rem;font-weight:600;color:var(--muted)}
.header-back{margin-left:auto;color:var(--green);text-decoration:none;font-size:.85rem;font-weight:500}
.main{flex:1;max-width:900px;width:100%;margin:0 auto;padding:24px}
h2{font-size:1.6rem;font-weight:700;margin-bottom:4px}
.subtitle{color:var(--muted);margin-bottom:24px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.card h3{font-size:1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;font-family:inherit}
.field input:focus{outline:none;border-color:var(--green)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:4px;transition:width .3s}
.progress-text{font-size:.8rem;color:var(--muted);margin-bottom:20px}
.checklist-section{margin-bottom:24px}
.section-title{font-size:.85rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:4px;cursor:pointer;transition:background .2s}
.check-item:hover{background:rgba(255,255,255,.04)}
.check-item.done{opacity:.6}
.check-item.done .check-label{text-decoration:line-through}
.check-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:12px;margin-top:1px}
.check-item.done .check-box{background:var(--green);border-color:var(--green);color:#fff}
.check-label{font-size:.9rem;flex:1}
.check-hint{font-size:.75rem;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:10px;margin-bottom:20px}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--green);color:var(--green)}
.disclaimer-footer{text-align:center;padding:16px 24px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);margin-top:auto}

    /* === 3-Theme Switcher === */
    .theme-switcher { display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:100px;padding:4px 6px;margin-left:8px; }
    .theme-dot { width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all 0.2s ease;position:relative; }
    .theme-dot:hover { transform:scale(1.15); }
    .theme-dot[data-theme="dark"] { background:#1A1A2E;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2); }
    .theme-dot[data-theme="purple"] { background:#9B59B6; }
    .theme-dot[data-theme="light"] { background:#F8F9FC;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.1); }
    .theme-dot.active { border-color:var(--accent, #2ECC85);transform:scale(1.15); }
    .theme-dot::after { content:attr(data-tooltip);position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-muted, #a3a3b8);background:var(--card, #252540);border:1px solid var(--border, #3D3D5C);padding:2px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.2s; }
    .theme-dot:hover::after { opacity:1; }
    html, html * { transition:background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }
    html.no-transition, html.no-transition * { transition:none !important; }
    .theme-float { position:fixed;top:12px;right:12px;z-index:9999; }
    /* Purple theme */
    html[data-theme="purple"] { --bg:#0D0D1A;--bg-secondary:#0A0A15;--card:#1A1228;--border:#3D2D5C;--accent:#9B59B6;--accent-light:#9B59B6;--accent-glow:rgba(155,89,182,0.1);--green:#9B59B6;--green-dark:#6B4C9A;--text:#ffffff;--text-muted:#b8a9c9;--accent-lighter:#C4A3F0;--green-gradient:linear-gradient(135deg,#9B59B6,#6B4C9A);--purple-gradient:linear-gradient(135deg,#9B59B6,#6B4C9A);--purple:#9B59B6;--purple-light:#B08AE0;--purple-glow:rgba(155,89,182,0.15);--primary:#9B59B6;--primary-light:#B08AE0;--primary-glow:rgba(155,89,182,0.15);--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#8b5cf6; }
    html[data-theme="purple"] nav, html[data-theme="purple"] .top-bar, html[data-theme="purple"] .header, html[data-theme="purple"] header { background:rgba(13,13,26,0.95)!important; }
    html[data-theme="purple"] .theme-switcher { background:rgba(155,89,182,0.08);border-color:rgba(155,89,182,0.15); }
    /* Light theme */
    html[data-theme="light"] { --bg:#F8F9FC;--bg-secondary:#EFF1F5;--card:#FFFFFF;--border:#E2E8F0;--accent:#1FAD73;--accent-light:#1FAD73;--accent-glow:rgba(31,173,115,0.1);--green:#1FAD73;--green-dark:#178A5C;--text:#1A1A2E;--text-muted:#6B7280;--accent-lighter:#4ADE94;--green-gradient:linear-gradient(135deg,#1FAD73,#178A5C);--purple-gradient:linear-gradient(135deg,#6B4C9A,#9B59B6);--purple:#6B4C9A;--purple-light:#9B59B6;--purple-glow:rgba(107,76,154,0.1);--primary:#1FAD73;--primary-light:#2ECC85;--primary-glow:rgba(31,173,115,0.1);--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6; }
    html[data-theme="light"] nav, html[data-theme="light"] .top-bar, html[data-theme="light"] .header, html[data-theme="light"] header { background:rgba(255,255,255,0.95)!important;box-shadow:0 1px 8px rgba(0,0,0,0.06); }
    html[data-theme="light"] .theme-switcher { background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.08); }
    html[data-theme="light"] .nav-logo text[fill="#ffffff"], html[data-theme="light"] .top-bar-logo text[fill="#ffffff"], html[data-theme="light"] .logo text[fill="#f0f0f5"], html[data-theme="light"] .logo text[fill="#ffffff"] { fill:#1A1A2E; }
  </style>
</head>
<body>
<div class="header">
  <div class="logo"><svg viewBox="0 0 120 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="14" stroke="#2ECC85" stroke-width="2.5" fill="none"/><circle cx="16" cy="16" r="6" fill="#2ECC85"/><text x="40" y="22" fill="#f0f0f5" font-family="Inter,sans-serif" font-weight="700" font-size="16">oney</text><text x="82" y="22" fill="#a3a3b8" font-family="Inter,sans-serif" font-weight="400" font-size="11">&amp; co</text></svg>  <div class="theme-switcher" role="radiogroup" aria-label="Theme"><div class="theme-dot active" data-theme="dark" data-tooltip="Dark" role="radio" aria-checked="true" tabindex="0"></div><div class="theme-dot" data-theme="purple" data-tooltip="Purple" role="radio" aria-checked="false" tabindex="0"></div><div class="theme-dot" data-theme="light" data-tooltip="Light" role="radio" aria-checked="false" tabindex="0"></div></div>
</div>
  <h1>Client Onboarding</h1>
  <a href="index.html" class="header-back">← Back to Tools</a>
</div>

<div class="main">
  <h2>📋 Client Onboarding Checklist</h2>
  <p class="subtitle">Track new client onboarding steps from initial contact to settlement</p>

  <div class="card">
    <div class="field"><label>Client Name</label><input type="text" id="clientName" placeholder="e.g. John & Jane Smith" oninput="save()"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="field"><label>Loan Purpose</label><input type="text" id="loanPurpose" placeholder="e.g. Owner Occupied Purchase" oninput="save()"></div>
      <div class="field"><label>Start Date</label><input type="date" id="startDate" oninput="save()"></div>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText"></div>

  <div class="actions">
    <button class="btn btn-green" onclick="resetChecklist()">🔄 New Client</button>
    <button class="btn btn-outline" onclick="window.print()">🖨️ Print</button>
  </div>

  <div id="checklistContainer"></div>
</div>

<div class="disclaimer-footer">⚠️ This tool is for informational purposes only and does not constitute financial advice.</div>

<script>
const SECTIONS=[
  {title:'Initial Contact',items:[
    {id:'intro_call',label:'Initial discovery call completed',hint:'Understand client goals, timeline, financial situation'},
    {id:'credit_guide',label:'Credit Guide provided',hint:'Must be provided before any credit assistance'},
    {id:'privacy',label:'Privacy consent form signed',hint:'Authority to collect and use personal information'},
    {id:'bid',label:'Best Interest Duty disclosure',hint:'Document how recommendation serves client\'s best interest'},
  ]},
  {title:'Documentation',items:[
    {id:'id_100',label:'100 points of ID verified',hint:'Drivers licence, passport, Medicare card etc.'},
    {id:'payslips',label:'Income documents collected',hint:'2 recent payslips, tax returns, NOAs'},
    {id:'bank_statements',label:'Bank statements (3 months)',hint:'All transaction accounts, savings, credit cards'},
    {id:'expenses',label:'Living expense declaration',hint:'HEM or declared expenses worksheet'},
    {id:'existing_loans',label:'Existing loan statements',hint:'Current mortgage, personal loans, car finance, HECS'},
    {id:'contract',label:'Contract of sale / pre-approval docs',hint:'If purchasing — signed contract; if refinancing — current loan details'},
  ]},
  {title:'Assessment & Submission',items:[
    {id:'serviceability',label:'Serviceability assessment run',hint:'Check borrowing capacity with target lenders'},
    {id:'product_select',label:'Product recommendation documented',hint:'Why this lender and product suits the client'},
    {id:'comparison',label:'Loan comparison provided to client',hint:'Show at least 2-3 options with pros/cons'},
    {id:'client_authority',label:'Client authority to proceed',hint:'Written confirmation to submit application'},
    {id:'application',label:'Application submitted to lender',hint:'Full application with all supporting docs'},
  ]},
  {title:'Approval & Settlement',items:[
    {id:'conditional',label:'Conditional approval received',hint:'Review conditions and action any outstanding items'},
    {id:'valuation',label:'Valuation ordered / completed',hint:'Lender valuation or existing valuation accepted'},
    {id:'unconditional',label:'Unconditional approval received',hint:'All conditions met — formal approval issued'},
    {id:'loan_docs',label:'Loan documents signed',hint:'Client has signed and returned loan documents'},
    {id:'settlement',label:'Settlement booked & completed',hint:'Confirm settlement date with all parties'},
  ]},
  {title:'Post-Settlement',items:[
    {id:'welcome',label:'Welcome / thank you sent',hint:'Personal touch — card, email, or gift'},
    {id:'review_date',label:'12-month review date set',hint:'Diary note for annual loan health check'},
    {id:'referral_ask',label:'Referral request made',hint:'Ask for referrals while experience is fresh'},
  ]},
];

let state={};
const STORAGE_KEY='oney-onboarding-v1';

function load(){
  try{state=JSON.parse(localStorage.getItem(STORAGE_KEY))||{};}catch(e){state={};}
  if(!state.checks)state.checks={};
  document.getElementById('clientName').value=state.clientName||'';
  document.getElementById('loanPurpose').value=state.loanPurpose||'';
  document.getElementById('startDate').value=state.startDate||new Date().toISOString().slice(0,10);
  renderChecklist();
}

function save(){
  state.clientName=document.getElementById('clientName').value;
  state.loanPurpose=document.getElementById('loanPurpose').value;
  state.startDate=document.getElementById('startDate').value;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  updateProgress();
}

function toggleCheck(id){
  state.checks[id]=!state.checks[id];
  save();
  renderChecklist();
}

function renderChecklist(){
  const container=document.getElementById('checklistContainer');
  container.innerHTML=SECTIONS.map(s=>`
    <div class="checklist-section">
      <div class="section-title">${s.title}</div>
      ${s.items.map(item=>{
        const done=state.checks[item.id];
        return `<div class="check-item ${done?'done':''}" onclick="toggleCheck('${item.id}')">
          <div class="check-box">${done?'✓':''}</div>
          <div><div class="check-label">${item.label}</div><div class="check-hint">${item.hint}</div></div>
        </div>`;
      }).join('')}
    </div>
  `).join('');
  updateProgress();
}

function updateProgress(){
  const total=SECTIONS.reduce((a,s)=>a+s.items.length,0);
  const done=SECTIONS.reduce((a,s)=>a+s.items.filter(i=>state.checks[i.id]).length,0);
  const pct=total>0?(done/total*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=`${done} of ${total} steps completed (${Math.round(pct)}%)`;
}

function resetChecklist(){
  if(!confirm('Start fresh for a new client? Current progress will be cleared.'))return;
  state={checks:{}};
  document.getElementById('clientName').value='';
  document.getElementById('loanPurpose').value='';
  document.getElementById('startDate').value=new Date().toISOString().slice(0,10);
  save();
  renderChecklist();
}

load();
window.addEventListener('message',e=>{if(e.data?.type==='THEME_CHANGE')document.documentElement.setAttribute('data-theme',e.data.theme)});
</script>
<script>
(function(){var s=localStorage.getItem('oney-theme')||'dark';document.documentElement.classList.add('no-transition');document.documentElement.setAttribute('data-theme',s);requestAnimationFrame(function(){requestAnimationFrame(function(){document.documentElement.classList.remove('no-transition')})});document.querySelectorAll('.theme-dot').forEach(function(d){d.classList.toggle('active',d.dataset.theme===s);d.setAttribute('aria-checked',String(d.dataset.theme===s))});var sw=document.querySelector('.theme-switcher');if(sw){sw.addEventListener('click',function(e){var dot=e.target.closest('.theme-dot');if(!dot)return;var t=dot.dataset.theme;document.documentElement.setAttribute('data-theme',t);localStorage.setItem('oney-theme',t);document.querySelectorAll('.theme-dot').forEach(function(d){d.classList.toggle('active',d.dataset.theme===t);d.setAttribute('aria-checked',String(d.dataset.theme===t))})});sw.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}})}})();
</script>
</body>
</html>
