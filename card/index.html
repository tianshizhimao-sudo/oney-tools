  <meta name="theme-color" content="#1A1A2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta property="og:title" content="Mao Dong - Founder">
  <meta property="og:description" content="Making financial health as normal as a medical checkup. Connect with me at Oney & Co.">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://oneyco.com.au/card/dong">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-green: #2ECC85;
      --secondary-green: #1FAD73;
      --accent-purple: #6B4C9A;
      --dark-bg: #1A1A2E;
      --darker-bg: #12121f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--dark-bg) 0%, var(--darker-bg) 100%);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    /* Animated background */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-gradient::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(46, 204, 133, 0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(107, 76, 154, 0.08) 0%, transparent 50%);
      animation: floatGradient 20s ease-in-out infinite;
    }

    @keyframes floatGradient {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(2%, 2%) rotate(1deg); }
      66% { transform: translate(-1%, 1%) rotate(-1deg); }
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 24px 60px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Logo section */
    .logo-section {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeInDown 0.8s ease-out;
    }

    .logo-svg {
      width: 140px;
      height: auto;
      margin-bottom: 8px;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Profile section */
    .profile-section {
      text-align: center;
      margin-bottom: 35px;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .profile-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(46, 204, 133, 0.3);
      position: relative;
    }

    .profile-icon::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-green), var(--accent-purple));
      z-index: -1;
      opacity: 0.5;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 0.3; }
    }

    .profile-icon svg {
      width: 50px;
      height: 50px;
    }

    .profile-name {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .profile-name-cn {
      font-size: 1rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
    }

    .profile-title {
      font-size: 0.95rem;
      color: var(--primary-green);
      font-weight: 500;
    }

    .profile-company {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Tagline */
    .tagline {
      text-align: center;
      margin-bottom: 35px;
      padding: 20px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    .tagline p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
    }

    .tagline p::before,
    .tagline p::after {
      content: '"';
      color: var(--primary-green);
    }

    /* Contact buttons */
    .contact-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    .action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }

    .action-btn svg {
      width: 20px;
      height: 20px;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
      color: white;
      box-shadow: 0 8px 25px rgba(46, 204, 133, 0.35);
    }

    .action-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(46, 204, 133, 0.45);
    }

    .action-btn.primary:active {
      transform: translateY(0);
    }

    .action-btn.secondary {
      background: var(--card-bg);
      color: white;
      border: 1px solid var(--border-color);
    }

    .action-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary-green);
    }

    /* Contact list */
    .contact-list {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      margin-bottom: 25px;
      animation: fadeInUp 0.8s ease-out 0.5s both;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 18px 20px;
      text-decoration: none;
      color: white;
      transition: all 0.2s ease;
      border-bottom: 1px solid var(--border-color);
    }

    .contact-item:last-child {
      border-bottom: none;
    }

    .contact-item:hover {
      background: rgba(46, 204, 133, 0.05);
    }

    .contact-item:active {
      background: rgba(46, 204, 133, 0.1);
    }

    .contact-icon {
      width: 40px;
      height: 40px;
      background: rgba(46, 204, 133, 0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-icon svg {
      width: 20px;
      height: 20px;
      fill: var(--primary-green);
    }

    .contact-icon.purple {
      background: rgba(107, 76, 154, 0.15);
    }

    .contact-icon.purple svg {
      fill: var(--accent-purple);
    }

    .contact-text {
      flex: 1;
      min-width: 0;
    }

    .contact-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .contact-value {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-arrow {
      color: rgba(255, 255, 255, 0.3);
      font-size: 1.2rem;
    }

    /* Social links */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 30px;
      animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    .social-link {
      width: 50px;
      height: 50px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-link svg {
      width: 22px;
      height: 22px;
      fill: rgba(255, 255, 255, 0.7);
      transition: fill 0.3s ease;
    }

    .social-link:hover {
      border-color: var(--primary-green);
      transform: translateY(-3px);
    }

    .social-link:hover svg {
      fill: var(--primary-green);
    }

    /* Save contact button */
    .save-contact {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--accent-purple), #8B5FBF);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(107, 76, 154, 0.35);
      animation: fadeInUp 0.8s ease-out 0.7s both;
    }

    .save-contact:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(107, 76, 154, 0.45);
    }

    .save-contact svg {
      width: 20px;
      height: 20px;
    }

    /* Footer */
    .footer {
      margin-top: auto;
      padding-top: 30px;
      text-align: center;
      animation: fadeInUp 0.8s ease-out 0.8s both;
    }

    .footer p {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .footer a {
      color: var(--primary-green);
      text-decoration: none;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(46, 204, 133, 0.95);
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 380px) {
      .container {
        padding: 30px 16px 50px;
      }

      .profile-name {
        font-size: 1.5rem;
      }

      .contact-actions {
        flex-direction: column;
      }
    }

    /* Print styles */
    @media print {
      .bg-gradient,
      .save-contact,
      .contact-arrow {
        display: none !important;
      }

      body {
        background: white;
        color: black;
      }

      .container {
        max-width: 100%;
      }
    }
  
    /* === 3-Theme Switcher === */
    .theme-switcher { display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:100px;padding:4px 6px;margin-left:8px; }
    .theme-dot { width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all 0.2s ease;position:relative; }
    .theme-dot:hover { transform:scale(1.15); }
    .theme-dot[data-theme="dark"] { background:#1A1A2E;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2); }
    .theme-dot[data-theme="purple"] { background:#9B59B6; }
    .theme-dot[data-theme="light"] { background:#F8F9FC;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.1); }
    .theme-dot.active { border-color:var(--accent, #2ECC85);transform:scale(1.15); }
    .theme-dot::after { content:attr(data-tooltip);position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-muted, #a3a3b8);background:var(--card, #252540);border:1px solid var(--border, #3D3D5C);padding:2px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.2s; }
    .theme-dot:hover::after { opacity:1; }
    html, html * { transition:background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }
    html.no-transition, html.no-transition * { transition:none !important; }
    .theme-float { position:fixed;top:12px;right:12px;z-index:9999; }
    /* Purple theme */
    html[data-theme="purple"] { --bg:#0D0D1A;--bg-secondary:#0A0A15;--card:#1A1228;--border:#3D2D5C;--accent:#9B59B6;--accent-light:#9B59B6;--accent-glow:rgba(155,89,182,0.1);--green:#9B59B6;--green-dark:#6B4C9A;--text:#ffffff;--text-muted:#b8a9c9;--accent-lighter:#C4A3F0;--green-gradient:linear-gradient(135deg,#9B59B6,#6B4C9A);--purple-gradient:linear-gradient(135deg,#9B59B6,#6B4C9A);--purple:#9B59B6;--purple-light:#B08AE0;--purple-glow:rgba(155,89,182,0.15);--primary:#9B59B6;--primary-light:#B08AE0;--primary-glow:rgba(155,89,182,0.15);--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#8b5cf6; }
    html[data-theme="purple"] nav, html[data-theme="purple"] .top-bar, html[data-theme="purple"] .header, html[data-theme="purple"] header { background:rgba(13,13,26,0.95)!important; }
    html[data-theme="purple"] .theme-switcher { background:rgba(155,89,182,0.08);border-color:rgba(155,89,182,0.15); }
    /* Light theme */
    html[data-theme="light"] { --bg:#F8F9FC;--bg-secondary:#EFF1F5;--card:#FFFFFF;--border:#E2E8F0;--accent:#1FAD73;--accent-light:#1FAD73;--accent-glow:rgba(31,173,115,0.1);--green:#1FAD73;--green-dark:#178A5C;--text:#1A1A2E;--text-muted:#6B7280;--accent-lighter:#4ADE94;--green-gradient:linear-gradient(135deg,#1FAD73,#178A5C);--purple-gradient:linear-gradient(135deg,#6B4C9A,#9B59B6);--purple:#6B4C9A;--purple-light:#9B59B6;--purple-glow:rgba(107,76,154,0.1);--primary:#1FAD73;--primary-light:#2ECC85;--primary-glow:rgba(31,173,115,0.1);--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6; }
    html[data-theme="light"] nav, html[data-theme="light"] .top-bar, html[data-theme="light"] .header, html[data-theme="light"] header { background:rgba(255,255,255,0.95)!important;box-shadow:0 1px 8px rgba(0,0,0,0.06); }
    html[data-theme="light"] .theme-switcher { background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.08); }
    html[data-theme="light"] .nav-logo text[fill="#ffffff"], html[data-theme="light"] .top-bar-logo text[fill="#ffffff"], html[data-theme="light"] .logo text[fill="#f0f0f5"], html[data-theme="light"] .logo text[fill="#ffffff"] { fill:#1A1A2E; }
  </style>
</head>

END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement('a');
      link.href = url;
      link.download = 'Mao_Dong_Oney_Co.vcf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      
      // Show toast
      showToast('Contact downloaded!');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    document.querySelectorAll('.contact-item, .action-btn, .social-link, .save-contact').forEach(el => {
      el.addEventListener('touchstart', () => {}, { passive: true });
    });
