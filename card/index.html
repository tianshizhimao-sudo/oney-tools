  <style>
    :root {
      --primary-green: #2ECC85;
      --secondary-green: #1FAD73;
      --accent-purple: #6B4C9A;
      --dark-bg: #1A1A2E;
      --darker-bg: #12121f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--dark-bg) 0%, var(--darker-bg) 100%);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    /* Animated background */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-gradient::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(46, 204, 133, 0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(107, 76, 154, 0.08) 0%, transparent 50%);
      animation: floatGradient 20s ease-in-out infinite;
    }

    @keyframes floatGradient {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(2%, 2%) rotate(1deg); }
      66% { transform: translate(-1%, 1%) rotate(-1deg); }
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 24px 60px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Logo section */
    .logo-section {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeInDown 0.8s ease-out;
    }

    .logo-svg {
      width: 140px;
      height: auto;
      margin-bottom: 8px;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Profile section */
    .profile-section {
      text-align: center;
      margin-bottom: 35px;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .profile-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(46, 204, 133, 0.3);
      position: relative;
    }

    .profile-icon::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-green), var(--accent-purple));
      z-index: -1;
      opacity: 0.5;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 0.3; }
    }

    .profile-icon svg {
      width: 50px;
      height: 50px;
    }

    .profile-name {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .profile-name-cn {
      font-size: 1rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
    }

    .profile-title {
      font-size: 0.95rem;
      color: var(--primary-green);
      font-weight: 500;
    }

    .profile-company {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Tagline */
    .tagline {
      text-align: center;
      margin-bottom: 35px;
      padding: 20px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    .tagline p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
    }

    .tagline p::before,
    .tagline p::after {
      content: '"';
      color: var(--primary-green);
    }

    /* Contact buttons */
    .contact-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    .action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }

    .action-btn svg {
      width: 20px;
      height: 20px;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
      color: white;
      box-shadow: 0 8px 25px rgba(46, 204, 133, 0.35);
    }

    .action-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(46, 204, 133, 0.45);
    }

    .action-btn.primary:active {
      transform: translateY(0);
    }

    .action-btn.secondary {
      background: var(--card-bg);
      color: white;
      border: 1px solid var(--border-color);
    }

    .action-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary-green);
    }

    /* Contact list */
    .contact-list {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      margin-bottom: 25px;
      animation: fadeInUp 0.8s ease-out 0.5s both;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 18px 20px;
      text-decoration: none;
      color: white;
      transition: all 0.2s ease;
      border-bottom: 1px solid var(--border-color);
    }

    .contact-item:last-child {
      border-bottom: none;
    }

    .contact-item:hover {
      background: rgba(46, 204, 133, 0.05);
    }

    .contact-item:active {
      background: rgba(46, 204, 133, 0.1);
    }

    .contact-icon {
      width: 40px;
      height: 40px;
      background: rgba(46, 204, 133, 0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-icon svg {
      width: 20px;
      height: 20px;
      fill: var(--primary-green);
    }

    .contact-icon.purple {
      background: rgba(107, 76, 154, 0.15);
    }

    .contact-icon.purple svg {
      fill: var(--accent-purple);
    }

    .contact-text {
      flex: 1;
      min-width: 0;
    }

    .contact-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .contact-value {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-arrow {
      color: rgba(255, 255, 255, 0.3);
      font-size: 1.2rem;
    }

    /* Social links */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 30px;
      animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    .social-link {
      width: 50px;
      height: 50px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-link svg {
      width: 22px;
      height: 22px;
      fill: rgba(255, 255, 255, 0.7);
      transition: fill 0.3s ease;
    }

    .social-link:hover {
      border-color: var(--primary-green);
      transform: translateY(-3px);
    }

    .social-link:hover svg {
      fill: var(--primary-green);
    }

    /* Save contact button */
    .save-contact {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--accent-purple), #8B5FBF);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(107, 76, 154, 0.35);
      animation: fadeInUp 0.8s ease-out 0.7s both;
    }

    .save-contact:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(107, 76, 154, 0.45);
    }

    .save-contact svg {
      width: 20px;
      height: 20px;
    }

    /* Footer */
    .footer {
      margin-top: auto;
      padding-top: 30px;
      text-align: center;
      animation: fadeInUp 0.8s ease-out 0.8s both;
    }

    .footer p {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .footer a {
      color: var(--primary-green);
      text-decoration: none;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(46, 204, 133, 0.95);
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 380px) {
      .container {
        padding: 30px 16px 50px;
      }

      .profile-name {
        font-size: 1.5rem;
      }

      .contact-actions {
        flex-direction: column;
      }
    }

    /* Print styles */
    @media print {
      .bg-gradient,
      .save-contact,
      .contact-arrow {
        display: none !important;
      }

      body {
        background: white;
        color: black;
      }

      .container {
        max-width: 100%;
      }
    }
  </style>
</head>

        <path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/>
      </svg>
      Save to Contacts
    </button>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 <a href="https://oneyco.com.au">Oney & Co</a> · ABN pending</p>
    </footer>

  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast">Contact saved!</div>

  <script>
    function downloadVCard() {
      const vcard = `BEGIN:VCARD
VERSION:3.0
N:Dong;Mao;;;
FN:Mao Dong
ORG:Oney & Co Pty Ltd
TITLE:Founder
TEL;TYPE=WORK,VOICE:+61412169459
EMAIL;TYPE=WORK:dong.m@oneyco.com.au
URL:https://oneyco.com.au
ADR;TYPE=WORK:;;Sydney;;NSW;;Australia
X-SOCIALPROFILE;TYPE=linkedin:https://linkedin.com/in/
X-SOCIALPROFILE;TYPE=twitter:https://x.com/oneyco_au
NOTE:Make financial health awareness as normal as a medical checkup.
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement('a');
      link.href = url;
      link.download = 'Mao_Dong_Oney_Co.vcf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      
      // Show toast
      showToast('Contact downloaded!');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Add touch feedback
    document.querySelectorAll('.contact-item, .action-btn, .social-link, .save-contact').forEach(el => {
      el.addEventListener('touchstart', () => {}, { passive: true });
    });
  </script>

</body>
</html>
